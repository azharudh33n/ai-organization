name: Improvement
description: Suggest a change to the skill, a playbook or the evals
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What goes wrong or could be better today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed change
  - type: textarea
    id: evidence
    attributes:
      label: Evidence
      description: Sources, eval results or examples that support the change.
