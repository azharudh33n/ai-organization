name: release

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write      # create the release
      id-token: write      # sign the provenance attestation
      attestations: write  # store the attestation
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check tag matches plugin version
        env:
          TAG: ${{ github.ref_name }}
        run: |
          version=$(python3 -c "import json;print(json.load(open('.claude-plugin/plugin.json'))['version'])")
          if [ "v$version" != "$TAG" ]; then
            echo "::error::tag $TAG does not match plugin.json version $version"; exit 1
          fi
      - name: Validate
        run: |
          python3 scripts/validate_skill.py
          python3 -m unittest discover -s tests
      - name: Build skill zip
        run: |
          mkdir -p dist
          (cd skills && zip -r -X ../dist/ai-organization-skill.zip ai-organization)
          (cd dist && sha256sum ai-organization-skill.zip > SHA256SUMS)
      - name: Extract release notes
        env:
          TAG: ${{ github.ref_name }}
        run: |
          awk -v v="${TAG#v}" '$0 ~ "^## "v {f=1; next} /^## / && f {exit} f' CHANGELOG.md > dist/notes.md
          test -s dist/notes.md
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/ai-organization-skill.zip
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: >
          gh release create "$TAG" dist/ai-organization-skill.zip dist/SHA256SUMS
          --title "ai-organization $TAG" --notes-file dist/notes.md --verify-tag
