name: eval

# Real, billed model runs. Manual only, with a hard cost ceiling.
# Needs an `eval` environment with an ANTHROPIC_API_KEY secret.
on:
  workflow_dispatch:
    inputs:
      runs:
        description: Runs per case
        type: number
        default: 3

permissions:
  contents: read

concurrency:
  group: eval
  cancel-in-progress: false

jobs:
  plugin-eval:
    name: claude plugin eval
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment: eval
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
      - name: Run eval suite with and without the skill
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          RUNS: ${{ inputs.runs }}
        run: >
          npx --yes @anthropic-ai/claude-code@2.1.322 plugin eval .
          --trust-plugin --allow-tools Write,Edit
          --runs "$RUNS" --threshold 0.8 --max-cost-usd 20
          --no-publish --json eval-results.json
      - name: Upload results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: eval-results
          path: |
            eval-results.json
            evals/results/
